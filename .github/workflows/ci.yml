name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Build the whole solution in Release. This compiles every project, including the
      # crash harness (Hermes.Messaging.CrashHarness), which CrashRecoveryTests invokes as a
      # child process. Because --no-build is used for the test step, the harness must already
      # be built here — the solution build guarantees that.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
